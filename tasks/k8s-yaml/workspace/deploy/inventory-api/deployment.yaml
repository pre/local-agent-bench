apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: node-inventory
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: node-inventory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: inventory-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-api
      initContainers:
        - name: migrate
          image: registry.example.internal/platform/inventory-api:2.14.3
          args: ["migrate", "--wait-for-db=60s"]
          env:
            - name: INVENTORY_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: DB_URL
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: registry.example.internal/platform/inventory-api:2.14.3
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: INVENTORY_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: DATABASE_URL
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-app
                  key: password
            - name: INVENTORY_LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: LISTEN_ADDR
            - name: INVENTORY_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: METRICS_ADDR
            - name: INVENTORY_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: LOG_LEVEL
            - name: INVENTORY_CACHE_TTL
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: CACHE_TTL
            - name: INVENTORY_SYNC_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: SYNC_INTERVAL
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  resource: limits.memory
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
