[project]
name = "llm-eval"
version = "0.1.0"
description = "Evaluation harness for Claude Code with a local inference server"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
llm-eval = "llm_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 80
